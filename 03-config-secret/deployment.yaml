apiVersion: apps/v1
kind: Deployment
metadata:
  name: configured-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: configured-web
  template:
    metadata:
      labels:
        app: configured-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          env:
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: APP_PASSWORD
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
      volumes:
        - name: page
          configMap:
            name: site-page
